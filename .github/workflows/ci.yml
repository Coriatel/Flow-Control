name: Flow Control CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  frontend:
    name: Frontend demo tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run focused demo-readiness tests
        run: node --test tests/demo-readiness-ui.test.mjs

      - name: Build production frontend
        run: npm run build

      - name: Verify patch whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"..HEAD

  backend:
    name: Backend transactional tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flow_control_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./server
        run: npx prisma generate

      # CI uses a disposable database. Production migration compatibility is a
      # separate owner-gated operation and is deliberately not inferred here.
      - name: Create disposable CI schema
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flow_control_test?schema=inventory
        run: npx prisma db push --skip-generate

      - name: Run Round A transactional tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flow_control_test?schema=inventory
          JWT_SECRET: test-jwt-secret-for-ci
          NODE_ENV: test
        run: npm test -- --runInBand src/__tests__/demoFixtureSecurity.test.ts src/__tests__/demoReceipt.test.ts src/__tests__/demoOrderCreation.test.ts

      - name: Build production backend
        working-directory: ./server
        run: npm run build

  dependency-audit:
    name: Dependency audit (critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit backend dependencies
        working-directory: ./server
        run: npm audit --omit=dev --audit-level=critical

  build-docker:
    name: Build immutable image
    runs-on: ubuntu-latest
    needs: [frontend, backend, dependency-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flow-control:${{ github.sha }} .
