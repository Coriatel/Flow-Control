

services:
  postgres:
    image: postgres:15-alpine
    container_name: flow-control-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flow_control
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Hostinger Resource Guard: mandatory limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    shm_size: '256m'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-control-frontend
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    # Hostinger Resource Guard: mandatory limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:

